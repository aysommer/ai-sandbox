<!doctype html>
<html lang="ru" data-theme="sandbox">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Симуляция города с жителями и рабочими сменами">
    <title>Город · AI Sandbox</title>
  </head>
  <body>
    <header class="app-bar">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>AI <strong>Sandbox</strong></h1>
      <a class="btn btn-ghost repository" href="./ecosystem.html">Экосистема NEAT</a>
    </header>
    <main class="workspace mx-auto w-full city">
      <div class="page-heading">
        <div><h2>Город</h2><p>Два района и восемь жителей</p></div>
        <div class="simulation-controls">
          <output class="mode city-clock" id="city-clock">День 1 · 07:00</output>
          <button class="btn btn-primary" id="city-run" disabled>Запустить</button>
          <button class="btn btn-ghost" id="city-step" disabled>+15 минут</button>
        </div>
      </div>
      <div class="dashboard">
        <section class="card surface settings tools" aria-labelledby="residents-title">
          <h3 id="residents-title">Жители</h3>
          <div id="city-residents" class="city-residents"></div>
        </section>
        <section class="card surface world" aria-labelledby="map-title">
          <div class="panel-header">
            <div><h3 id="map-title">Карта города</h3><p>Выберите жителя на карте или в списке</p></div>
            <label class="city-speed"><span>Скорость</span><select class="select" id="city-speed" disabled><option value="1">1×</option><option value="4">4×</option><option value="12">12×</option></select></label>
          </div>
          <div class="city-map"><canvas id="city-map" aria-label="Карта двух районов с рабочими местами"></canvas></div>
          <p id="city-status" class="world-stats" role="status">Загрузка города…</p>
        </section>
        <aside class="side">
          <section class="card surface settings" aria-labelledby="citizen-title">
            <h3 id="citizen-title">О жителе</h3>
            <div id="city-inspector">Выберите жителя.</div>
          </section>
          <section class="card surface console" aria-labelledby="journal-title">
            <div class="panel-header"><div><h3 id="journal-title">Журнал смен</h3></div></div>
            <ol id="city-events" aria-label="Последние события смен"></ol>
            <p id="city-empty" class="world-stats">Событий пока нет.</p>
          </section>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/city/main.ts"></script>
  </body>
</html>
