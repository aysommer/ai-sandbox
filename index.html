<!doctype html>
<html lang="ru" data-theme="sandbox">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="2D-песочница для наблюдения за нейроэволюцией">
    <title>AI Sandbox</title>
  </head>
  <body>
    <header class="app-bar">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>AI <strong>Sandbox</strong></h1>
      <a class="btn btn-ghost repository" href="https://github.com/aysommer/ai-sandbox">Репозиторий</a>
    </header>
    <main class="workspace mx-auto w-full">
      <div class="page-heading">
        <div>
          <h2>Песочница</h2>
          <p>Среда для наблюдения за нейроэволюцией</p>
        </div>
        <span class="mode"><span aria-hidden="true"></span>Демонстрация</span>
      </div>
      <div class="dashboard">
        <section class="card surface world" aria-labelledby="map-title">
          <div class="panel-header">
            <div><h3 id="map-title">Карта мира</h3><p>Выберите сущность на карте</p></div>
            <div class="map-controls" aria-label="Управление картой">
              <button type="button" class="btn btn-ghost" id="zoom-out" aria-label="Уменьшить масштаб">−</button>
              <output id="zoom-value" aria-label="Масштаб">100%</output>
              <button type="button" class="btn btn-ghost" id="zoom-in" aria-label="Увеличить масштаб">+</button>
            </div>
          </div>
          <div class="map">
            <canvas id="world" aria-label="Демонстрационная карта с шестью сущностями"></canvas>
            <span class="map-label">ДЕМО-КАРТА</span>
          </div>
          <div class="legend" aria-label="Легенда карты">
            <span><i class="dot entity"></i>Сущность</span>
            <span><i class="dot food"></i>Пища</span>
            <span><i class="dot obstacle"></i>Препятствие</span>
          </div>
        </section>
        <aside class="side" aria-label="Управление и консоль">
          <section class="card surface settings" aria-labelledby="controls-title">
            <h3 id="controls-title">Управление</h3>
            <label for="selected-agent">Сущность</label>
            <select id="selected-agent" class="select select-bordered w-full">
              <option value="">Выберите сущность</option>
            </select>
            <button type="button" class="btn btn-primary w-full" id="reset">Сбросить вид</button>
          </section>
          <section class="card surface console" aria-labelledby="console-title">
            <div class="panel-header">
              <div><h3 id="console-title">Консоль</h3><p>События интерфейса</p></div>
              <button type="button" class="btn btn-ghost" id="clear">Очистить</button>
            </div>
            <ol id="events" aria-label="Журнал событий" aria-live="polite" aria-relevant="additions"></ol>
            <p id="empty-events" hidden>Журнал пуст</p>
          </section>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
